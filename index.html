<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>OpenCV.js - Exemplo</title>
        <link rel="stylesheet" href="css/style.css">
        <script async src="https://cdn.jsdelivr.net/npm/opencv.js/opencv.js"></script>
        <script type="module" src="js/app.js"></script>
    </head>

    <body>

        <div class="header">
            <h1>314-u VISION</h1>
            <div class="subtitle">
                Steganography • IMAGE ANALYZER • DATA EDITOR
            </div>
        </div>

        <div class="container">

            <!-- PAINEL ESQUERDO -->
            <div class="panel">

                <h2>IMAGE PROCESSING</h2>

                <input
                type="file"
                id="imageInput"
                accept="image/*">
                
                <canvas id="canvas"></canvas>
                <button id="saveBtn" disabled >SAVE IMAGE</button>
            </div>

            <!-- PAINEL DIREITO -->
            <div class="panel">

                <h2>DATA TERMINAL</h2>

                <input type="file" id="dataInput">
                <button id="resetBtn" disabled >RESET DATA</button>
                <button id="mergeBtn" disabled >MERGE DATA</button>
                <button id="exportBtn" disabled >EXPORT DATA</button>
                <textarea id="txtContent" spellcheck="false" placeholder="Waiting for imported data..."></textarea>

            </div>

        </div>

        <div class="status">

            <strong>STATUS //</strong>
            <span id="status">
                INITIALIZING OpenCV...
            </span>

        </div>

        <div class="footer">
            CYBER VISION v1.0 • OpenCV.js • CLIENT SIDE PROCESSING
        </div>
    </body>
</html>
