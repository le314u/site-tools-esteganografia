name: Deploy Esteganografia

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Baixar o código do projeto
      - name: Checkout site-tools-esteganografia
        uses: actions/checkout@v4

      # 2. Preparar arquivos para deploy
      - name: Preparar pasta de deploy
        run: |
          mkdir deploy
          rsync -av \
            --exclude 'README.md' \
            --exclude 'deploy' \
            ./ deploy/

      # 3. Publicar no repositório principal
      - name: Deploy para /tools/esteganografia
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PERSONAL_TOKEN }}
          external_repository: le314u/le314u.github.io
          publish_branch: prod
          publish_dir: ./deploy
          destination_dir: tools/esteganografia
