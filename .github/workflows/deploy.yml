name: Deploy Esteganografia

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar pasta de deploy
        run: |
          mkdir deploy
          rsync -av \
            --exclude 'README.md' \
            --exclude 'deploy' \
            ./ deploy/

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PERSONAL_TOKEN }}
          external_repository: le314u/le314u.github.io
          publish_branch: prod
          publish_dir: ./deploy
          destination_dir: tools/esteganografia
